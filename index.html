<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXEL WEATHER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="app">
      <header class="top-bar">
        <h1 class="logo">PIXEL<span>WX</span></h1>
        <form class="search" id="search-form">
          <input
            id="city-input"
            type="text"
            placeholder="FIND A CITY..."
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" title="Search">GO</button>
          <button type="button" id="geo-btn" title="Use my location">GPS</button>
        </form>
        <button type="button" id="unit-btn" class="unit-btn" title="Toggle units">
          °C
        </button>
      </header>

      <section class="stage-wrap">
        <canvas id="scene" width="320" height="180" aria-label="Weather animation"></canvas>
      </section>

      <section class="hud">
        <div>
          <p class="place" id="place">SCANNING SKY...</p>
          <p class="condition" id="condition">LOADING</p>
        </div>
        <p class="temp" id="temp">--°</p>
        <div class="stats">
          <span id="feels">FEELS --</span>
          <span id="humidity">HUM --%</span>
          <span id="wind">WIND --</span>
        </div>
      </section>

      <div class="fx-row" aria-label="Weather animations">
        <button type="button" data-fx="sun">SUN</button>
        <button type="button" data-fx="rain">RAIN</button>
        <button type="button" data-fx="fog">FOG</button>
        <button type="button" data-fx="wind">WIND</button>
      </div>

      <section class="forecast" aria-label="Five day forecast">
        <h2>NEXT 5 DAYS</h2>
        <p class="hint" id="hint">CLICK A DAY OR A SCENE TO PLAY ITS WEATHER</p>
        <div class="forecast-row" id="forecast"></div>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
